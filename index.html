<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anomaly Zone - Кордон</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* Фоны */
    #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    #bg div {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      opacity: 0;
      -webkit-transition: opacity 2s ease-in-out;
      transition: opacity 2s ease-in-out;
    }
    #bg div.active { opacity: 1; }

    .metal-frame {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 4;
      box-shadow: inset 0 0 80px rgba(0,0,0,0.5);
    }

    .hud-scan {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
      background-image: linear-gradient(transparent 30%, rgba(0,0,0,0.02) 31%);
      background-size: 100% 6px;
      opacity: 0.25;
    }

    .tips {
      position: fixed;
      left: 5%;
      width: 90%;
      bottom: 4%;
      z-index: 6;
      color: #ffdb99;
      font-family: Inter, Consolas, monospace, sans-serif;
      font-size: 16px;
      text-align: center;
    }
    .tips h3 {
      margin: 0 0 6px 0;
      color: #ffb84d;
      font-size: 16px;
    }
    #tipText { font-size: 16px; }

    @media (min-width: 1600px) {
      .tips, .tips h3, #tipText { font-size: 20px; }
    }
  </style>
</head>
<body>

  <div id="bg">
    <div class="active" style="background-image:url('img/1.png')"></div>
    <div style="background-image:url('img/2.png')"></div>
    <div style="background-image:url('img/3.png')"></div>
  </div>

  <div class="metal-frame"></div>
  <div class="hud-scan"></div>

  <div class="tips">
    <h3>Совет:</h3>
    <div id="tipText"></div>
  </div>

  <script>
    // Смена фонов
    var slides = document.querySelectorAll('#bg div');
    var cur = 0;
    setInterval(function () {
      slides[cur].className = '';
      cur = (cur + 1) % slides.length;
      slides[cur].className = 'active';
    }, 8000);

    var tips = [

      'В дальние походы нужно брать еду.',
      'Без выносливости можно стать лёгкой мишенью.',
      'Некоторые медикаменты защищают от вредных воздействий.',
      'Значок крови предупреждает о кровотечении.',
      'Значок радиации предупреждает об облучении.',
      'Отношения с торговцами влияют на цены и ассортимент.',
      'Радиоактивность артефактов можно компенсировать другими артефактами.',

      'Пистолеты эффективны против слабо бронированных врагов.',
      'Попадание в голову смертельно для большинства противников.',
      'У каждого мутанта свои способы атаки и защиты.',
      'При появлении индикатора вражеской гранаты нужно уходить из зоны поражения.',
      'Прыжок с разбега помогает преодолевать большие ямы.',
      'Индикаторы здоровья и выносливости находятся внизу экрана.',
      'Снайперские винтовки эффективны на больших расстояниях.',
      'При стрельбе в движении точность снижается.',

      'Артефакты не только продаются, но и обладают полезными свойствами.',
      'Некоторые объекты имеют повышенный радиационный фон.',
      'У некоторых прицелов можно регулировать дальность.',

      'Можно выглядывать из-за углов с помощью Q и E.',
      'L включает и выключает фонарик.',
      '6 достаёт болт.',
      'N включает и выключает ночное видение.',
      'F1–F4 используются для предметов быстрого доступа.',
      'В КПК хранятся карта, задания, статистика и сообщения.',
      'O достаёт детектор артефактов.',
      'Правая кнопка мыши включает прицеливание.',
      'B переключает обычную стрельбу и подствольный гранатомёт.',
      'Y переключает тип боеприпасов.',
      'R перезаряжает оружие.',
      'G выбрасывает оружие.',
      'I открывает рюкзак.',
      'Перед исследованием Зоны обязательно приобрети дозиметр. Он поможет определять уровень радиационного заражения окружающей среды и вовремя избегать опасных участков.'
    ];

    var tipText = document.getElementById('tipText');
    var lastTipIndex = -1;

    function showTip() {
      var nextIndex;
      if (tips.length <= 1) {
        nextIndex = 0;
      } else {
        do {
          nextIndex = Math.floor(Math.random() * tips.length);
        } while (nextIndex === lastTipIndex);
      }
      lastTipIndex = nextIndex;
      tipText.textContent = tips[nextIndex];
    }

    showTip();
    setInterval(showTip, 30000);
  </script>

</body>
</html>
